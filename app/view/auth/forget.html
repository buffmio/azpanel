{include file="../app/view/auth/header.html" title="重置密码" /}

<section class="az-auth__panel az-card" aria-labelledby="forget-title">
  <h1 id="forget-title">重置密码</h1>
  <form class="az-auth__form" action="/forget" method="post" data-auth-forget>
    <div class="az-field">
      <label for="email">注册邮箱</label>
      <input class="az-input" id="email" name="email" type="email" autocomplete="email" required>
    </div>

    <div class="az-field">
      <label for="passwd">设置新密码</label>
      <input class="az-input" id="passwd" name="passwd" type="password" autocomplete="new-password" required>
    </div>

    <div class="az-field">
      <label for="repeat-passwd">再次输入新密码</label>
      <input class="az-input" id="repeat-passwd" name="repeat_passwd" type="password" autocomplete="new-password" required>
    </div>

    <div class="az-field">
      <label for="verify-code">邮箱验证码</label>
      <input class="az-input" id="verify-code" name="verify_code" type="text" autocomplete="one-time-code" required>
    </div>

    <button class="az-button" type="button" data-request-code="/forget/code">获取验证码</button>
    <button class="az-button az-button--primary" type="submit" data-submit>重置密码</button>
  </form>

  <p><a href="/login">返回登录</a></p>
</section>

<script type="module" src="/static/js/auth/forget.js"></script>
{include file="../app/view/auth/footer.html" /}
